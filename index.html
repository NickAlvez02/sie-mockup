<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corporativo SIE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="sie-loading" style="min-height:100vh;display:grid;place-items:center;font-family:Inter,sans-serif;color:#0A2A43">Cargando mockup de Corporativo SIE…</div>
<script>
(async()=>{
  const bodyFiles=["parts/body-01.txt","parts/body-02.txt","parts/body-03.txt","parts/body-04.txt","parts/body-05.txt"];
  const cssFiles=["styles/style-01.txt","styles/style-02.txt","styles/style-03.txt"];
  const jsFiles=["scripts/script-01.txt"];
  const load=async files=>(await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f);return r.text();}))).join('');
  try{
    const [markup,css,js]=await Promise.all([load(bodyFiles),load(cssFiles),load(jsFiles)]);
    const style=document.createElement('style');style.textContent=css;document.head.appendChild(style);
    document.body.innerHTML=markup;
    const script=document.createElement('script');script.textContent=js;document.body.appendChild(script);
  }catch(e){
    console.error(e);
    document.body.innerHTML='<main style="font-family:Inter,sans-serif;padding:40px;text-align:center"><h1>No se pudo cargar el mockup</h1><p>Actualiza la página en unos segundos.</p></main>';
  }
})();
</script>
</body>
</html>
