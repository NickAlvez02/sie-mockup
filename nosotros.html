<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corporativo SIE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="sie-loading" style="min-height:100vh;display:grid;place-items:center;font-family:Inter,sans-serif;color:#0A2A43">Cargando Corporativo SIE…</div>
<script>
(async()=>{
 const files=["parts/body-01.txt","parts/body-02.txt","parts/body-03.txt","parts/body-04.txt","parts/body-05.txt","styles/style-01.txt","styles/style-02.txt","styles/style-04.txt","styles/style-03.txt","scripts/script-01.txt"];
 const path=location.pathname.toLowerCase();
 const page=path.endsWith('/contpaqi.html')?'contpaqi':path.endsWith('/siigo-aspel.html')?'siigo-aspel':path.endsWith('/nosotros.html')?'nosotros':'home';
 try{
  const b64=(await Promise.all(files.map(async f=>{const r=await fetch(f+'?v=52',{cache:'no-store'});if(!r.ok)throw new Error(f);return r.text()}))).join('');
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const ds=new DecompressionStream('gzip');
  const json=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
  const data=JSON.parse(json), view=data.pages[page];
  const style=document.createElement('style');style.textContent=data.css;document.head.appendChild(style);
  document.body.innerHTML=view.html;
  const script=document.createElement('script');script.textContent=view.js;document.body.appendChild(script);
 }catch(e){console.error(e);document.body.innerHTML='<main style="font:16px Inter,sans-serif;padding:48px;text-align:center;color:#0A2A43"><h1>No se pudo cargar el mockup</h1><p>Actualiza la página en unos segundos.</p></main>'}
})();
</script>
</body>
</html>
